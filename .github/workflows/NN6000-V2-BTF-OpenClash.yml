name: NN6000-V2-BTF-OpenClash

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '仅生成配置，不编译固件'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: NN6000-V2-BTF
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: NN6000-V2-BTF-WIFI-NO
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_TEST: ${{ inputs.TEST || false }}
      WRT_PACKAGE: |
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_bash=y
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_ip-full=y
        CONFIG_PACKAGE_ipset=y
        CONFIG_PACKAGE_ruby=y
        CONFIG_PACKAGE_ruby-yaml=y
        CONFIG_PACKAGE_kmod-tun=y
        CONFIG_PACKAGE_kmod-inet-diag=y
        CONFIG_PACKAGE_kmod-nft-tproxy=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-lib-base=y
        CONFIG_PACKAGE_luci-lib-ipkg=y
        CONFIG_PACKAGE_luci-lua-runtime=y
        CONFIG_PACKAGE_openssl-util=y
        CONFIG_PACKAGE_xz-utils=y
        CONFIG_PACKAGE_luci-app-homeproxy=n
        CONFIG_PACKAGE_luci-app-daed=n
        CONFIG_PACKAGE_dae=n
        CONFIG_PACKAGE_docker=n
        CONFIG_PACKAGE_dockerd=n
        CONFIG_PACKAGE_luci-app-dockerman=n
        CONFIG_PACKAGE_luci-app-samba4=n
        CONFIG_PACKAGE_samba4-server=n
        CONFIG_PACKAGE_kmod-fs-ksmbd=n
        CONFIG_PACKAGE_luci-app-upnp=n
        CONFIG_PACKAGE_miniupnpd-nftables=n
        CONFIG_PACKAGE_miniupnpd-iptables=n
        CONFIG_PACKAGE_kmod-wireguard=n
        CONFIG_PACKAGE_wireguard-tools=n
        CONFIG_PACKAGE_luci-proto-wireguard=n
        CONFIG_PACKAGE_kmod-usb-core=n
        CONFIG_PACKAGE_kmod-usb3=n
        CONFIG_PACKAGE_kmod-usb-dwc3=n
        CONFIG_PACKAGE_kmod-usb-ehci=n
        CONFIG_PACKAGE_kmod-usb-ohci=n
        CONFIG_PACKAGE_kmod-usb-uhci=n
        CONFIG_PACKAGE_kmod-usb-storage=n
        CONFIG_PACKAGE_kmod-usb-storage-extras=n
        CONFIG_PACKAGE_kmod-usb-storage-uas=n
        CONFIG_PACKAGE_kmod-usb-net=n
        CONFIG_PACKAGE_usbutils=n
        CONFIG_PACKAGE_usb-modeswitch=n
        CONFIG_PACKAGE_usbmuxd=n
        CONFIG_PACKAGE_libimobiledevice=n
        CONFIG_PACKAGE_kmod-nvme=n
        CONFIG_PACKAGE_libnvme=n
        CONFIG_PACKAGE_nvme-cli=n
        CONFIG_PACKAGE_kmod-ata-core=n
        CONFIG_PACKAGE_kmod-ata-ahci=n
        CONFIG_PACKAGE_kmod-fs-btrfs=n
        CONFIG_PACKAGE_automount=n
        CONFIG_PACKAGE_blkid=n
        CONFIG_PACKAGE_fdisk=n
        CONFIG_PACKAGE_cfdisk=n
        CONFIG_PACKAGE_cgdisk=n
        CONFIG_PACKAGE_gdisk=n
        CONFIG_PACKAGE_sgdisk=n
        CONFIG_PACKAGE_sfdisk=n
        CONFIG_PACKAGE_smartmontools=n
        CONFIG_PACKAGE_smartmontools-drivedb=n
        CONFIG_PACKAGE_lsblk=n
        CONFIG_PACKAGE_mmc-utils=n
        CONFIG_PACKAGE_luci-app-mini-diskmanager=n
        CONFIG_CCACHE=y
        CONFIG_DEVEL=y
        CONFIG_FEED_video=n
        CONFIG_FEED_pon_drivers=n
        CONFIG_FEED_pon_userspace=n
        CONFIG_TARGET_MULTI_PROFILE=y
        CONFIG_TARGET_PER_DEVICE_ROOTFS=y
        CONFIG_TARGET_ROOTFS_INITRAMFS=n
        CONFIG_KERNEL_DEBUG_INFO=y
        # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
        CONFIG_KERNEL_DEBUG_INFO_BTF=y

name: NN6000-V2

on:
  #自动编译：每天早上7点23（23:23 UTC 触发，即北京次日7:23）
  #分钟数错开整点：GitHub 整点 0 分的定时任务最容易拥堵延迟
  schedule:
    - cron: 23 23 * * *
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions:
  contents: write
  # WRT-CORE 的 cache-rollover job 用 gh cache list/delete 轮换构建缓存，
  # 语义上需要 actions 读写权限。实测在本仓库当前继承行为下 actions 本就可用
  # （日志中 gh cache list 未报 403，缓存稳定保持 1 个世代），故此处不是缺陷修复，
  # 而是把隐含依赖显式化：若将来 GitHub 收紧 token 继承策略，rollover 会静默 403，
  # 表现为缓存逐轮堆积直至撑满配额并挤掉最新缓存。Auto-Clean.yml 同样授予了这两项。
  actions: write

# 定时任务与手动触发串行执行：同一时间只跑一个构建，
# 避免两个 runner 同时抢磁盘/缓存（曾因磁盘写满导致整轮构建失败）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: NN6000-V2
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-NO
      WRT_THEME: argon
      WRT_NAME: "OWRT"
      # 密码必须加引号：纯数字会被 YAML 当成整数，
      # 以 0 开头的密码会被吃掉前导 0（01234567 → 1234567），且不报错
      WRT_SSID: "OWRT"
      WRT_WORD: "12345678"
      WRT_IP: "192.168.10.1"
      WRT_PW: "无"
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST || false }}

#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  # 不在工作流级别注入 GITHUB_TOKEN：core job 里会执行第三方插件的 Makefile，
  # 令牌只在真正需要它的 cache-rollover job 内单独提供
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  # ccache 若不限体积会随每轮构建持续膨胀，与构建缓存叠加后撑爆 runner 磁盘
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 只做索引更新+装依赖，不再整机 full-upgrade：
          # 每次构建都全量升级会拉进不可控的新版包，白白多花 2 分钟还容易把构建搞挂
          sudo apt-get -yqq update
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Free Disk Space
        run: |
          echo "=========== 清理前 ==========="
          df -h / /mnt 2>/dev/null || df -h

          # runner 镜像预装了大量与固件编译无关的 SDK/语言运行时，全量删除可释放 40G 以上。
          # 注意：/opt/hostedtoolcache/go 是构建宿主 Go 工具链，prepare-build-host.sh 依赖它
          #（用于 CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT），整目录删除会导致
          # "go: command not found" 并在 Custom Settings 阶段以 127 退出，因此只在下面单独裁剪它。
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/az \
            /opt/microsoft \
            /usr/local/lib/node_modules \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/share/miniconda \
            /usr/lib/jvm 2>/dev/null || true

          # hostedtoolcache 只清非 Go 的缓存（node/python/ruby 等），保留 go
          if [ -d /opt/hostedtoolcache ]; then
            sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name 'go' -exec rm -rf {} + 2>/dev/null || true
          fi

          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker builder prune --all --force 2>/dev/null || true
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          sudo apt-get -yqq clean
          sudo swapoff -a 2>/dev/null || true

          # 构建宿主 Go 工具链必须存活，否则 Custom Settings 阶段的
          # prepare-build-host.sh 会以 127 退出（历史故障点），这里前置拦截
          if ! command -v go >/dev/null 2>&1; then
            echo "::error::Go 工具链不可用，清理步骤删过头了"
            exit 1
          fi
          echo "Go: $(go version)"

          echo "=========== 清理后 ==========="
          df -h / /mnt 2>/dev/null || df -h
          # 可用空间低于 45G 时明确告警：部分包走 Go 源码编译，GOCACHE 与 build_dir 峰值可达数 G
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "rootfs 可用: ${AVAIL}G"
          if [ "${AVAIL:-0}" -lt 45 ]; then
            echo "::warning::可用空间仅 ${AVAIL}G，低于 45G 建议值，Go 编译阶段有爆盘风险"
          fi

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          # 无人值守构建：feeds 拉取常因 GitHub 限流/抖动失败，重试 3 次再判定
          for i in 1 2 3; do
            if ./scripts/feeds update -a && ./scripts/feeds install -a; then
              echo "feeds 更新成功（第 $i 次）"
              break
            fi
            echo "::warning::feeds 更新第 $i 次失败，20 秒后重试"
            [ "$i" -lt 3 ] || { echo "::error::feeds 连续 3 次更新失败"; exit 1; }
            sleep 20
          done

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          # dl 下载失败会拖到编译阶段才炸，且日志难读，这里先重试两次
          make download -j$(nproc) || make download -j1 V=s || {
            echo "::warning::源码包下载有失败项，继续编译（缺包会在编译阶段暴露）"
          }

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        timeout-minutes: 240
        run: |
          cd ./wrt/

          echo "=========== 编译前资源 ==========="
          df -h / /mnt 2>/dev/null || df -h
          free -m
          du -sh .ccache 2>/dev/null || true

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

          echo "=========== 编译后资源 ==========="
          df -h / /mnt 2>/dev/null || df -h

      - name: Diagnose Build Failure
        if: ${{ !inputs.WRT_TEST && failure() }}
        continue-on-error: true
        run: |
          # 无人值守跑构建时，失败原因必须自己浮出来：
          # 1) 把判断结论写进 $GITHUB_STEP_SUMMARY（GitHub 页面顶部直接可见，手机也能看）
          # 2) 用 ::error:: 让结论在日志里高亮
          # 3) 原文落到 build-reports/failure-summary.txt，随 artifact 保存 7 天
          OUT="$GITHUB_WORKSPACE/build-reports/failure-summary.txt"
          mkdir -p "$GITHUB_WORKSPACE/build-reports"

          AVAIL=$(df -BG --output=avail / 2>/dev/null | tail -1 | tr -dc '0-9')
          ERRORS=""

          {
            echo "时间: $(date '+%F %T')"
            echo "可用磁盘: ${AVAIL:-未知}G"
            echo
            echo "--- 内存 ---"
            free -m 2>/dev/null || true
            echo
            echo "--- logs/ 中最新的编译错误（尾部 60 行）---"
            NEWEST=$(ls -t ./wrt/logs/package/**/compile.txt ./wrt/logs/target/**/compile.txt \
                      ./wrt/logs/package/**/**/compile.txt 2>/dev/null | head -1)
            if [ -n "$NEWEST" ]; then
              echo "来源: $NEWEST"
              tail -60 "$NEWEST" 2>/dev/null || true
            else
              echo "（未找到 compile.txt，回退到全量日志 grep）"
              grep -rhoiE "(error|fatal|No space left|Killed|undefined reference)" \
                ./wrt/logs/ 2>/dev/null | tail -60 || true
            fi
          } > "$OUT" 2>&1

          # 判因（环境类优先：环境缺失时不会有 compile.txt，往下判全是误导）
          if ! command -v go >/dev/null 2>&1; then
            ERRORS="构建机 Go 工具链缺失（go 不在 PATH）→ Free Disk Space 清理过界，prepare-build-host.sh 在 Custom Settings 阶段以 127 退出"
          elif [ -n "$AVAIL" ] && [ "$AVAIL" -lt 3 ]; then
            ERRORS="磁盘写满（No space left on device）→ 需扩容或减少编译产物"
          elif grep -qi "No space left on device" "$OUT"; then
            ERRORS="磁盘写满（No space left on device）→ 需扩容或减少编译产物"
          elif grep -qiE "Killed|Out of memory|out of memory" "$OUT"; then
            ERRORS="进程被 OOM Killer 杀掉 → 内存不足（Go 源码编译阶段最容易触发）"
          elif grep -qiE "command not found|exit code 127" "$OUT"; then
            ERRORS="构建机缺少命令或工具链（command not found / exit 127）→ 检查 Free Disk Space 是否误删工具链"
          elif grep -qi "golang" "$OUT" && grep -qiE "error" "$OUT"; then
            ERRORS="疑似 Go 工具链问题 → 检查 golang1.27 是否可用（Free Disk Space 是否误删 hostedtoolcache/go）"
          elif [ ! -s "$OUT" ] || ! grep -qiE "(error|fatal)" "$OUT"; then
            ERRORS="失败发生在编译之前的准备阶段（无编译日志）→ 逐个检查 Custom Packages / Custom Settings / Download Packages"
          else
            ERRORS="具体包的编译错误，详见下方摘要"
          fi

          {
            echo "## ❌ 编译失败诊断"
            echo ""
            echo "**判断：${ERRORS}**"
            echo ""
            echo '```'
            tail -60 "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::${ERRORS}"
          echo "诊断原文已写入 build-reports/failure-summary.txt"

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            # WIFI-NO 固件用 nowifi.dtsi，没有射频，发布说明里不能列出 SSID/密码
            if [[ "$WRT_WIFI" == "WIFI-NO" ]]; then
              echo "WRT_WIFI_INFO=WIFI：此固件为无 Wi-Fi 版本，无线功能未启用。" >> $GITHUB_ENV
            else
              {
                echo "WRT_WIFI_INFO<<__WIFI_EOF__"
                echo "WIFI名称：$WRT_SSID"
                echo "WIFI密码：$WRT_WORD"
                echo "__WIFI_EOF__"
              } >> $GITHUB_ENV
            fi

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      # TEST 模式只产出 .config，改用 artifact 上传。
      # 不能照常发 release：那样的 release 只含一个 Config 文件，却会成为"最新发布"，
      # 而 Auto-Clean 只保留最新 1 个 release，上一版真固件会被挤掉删除。
      - name: Upload Config
        if: ${{ inputs.WRT_TEST }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}-${{github.run_attempt}}
          path: ./wrt/upload/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Release Firmware
        if: ${{ !inputs.WRT_TEST }}
        uses: softprops/action-gh-release@6680cc089e59314c4460b839412c25fb6a71ce3b # master 2026-10-17
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            ${{env.WRT_WIFI_INFO}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done

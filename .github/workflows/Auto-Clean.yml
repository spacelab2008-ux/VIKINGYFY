name: Auto-Clean
on:
  #自动清理：每天早上5点
  schedule:
    - cron: 21 21 * * *
  #手动清理
  workflow_dispatch:
permissions: write-all
jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@f5873e66feb0a85460d7fbc073de6c89470e94d3 # main 2026-10-03
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 1
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
